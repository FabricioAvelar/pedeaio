databases:
  - name: pedeaio_db
    plan: free
    databaseName: pedeaio
    user: pedeaio_user

services:
  - type: web
    plan: free
    name: pedeaio
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn pedeaio.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pedeaio_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4